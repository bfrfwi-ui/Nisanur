<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özür Dilerim</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fad0c4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      padding: 50px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,154,158,0.1) 0%, transparent 70%);
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .heart {
      font-size: 64px;
      margin-bottom: 20px;
      animation: heartbeat 1.5s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #e85a71;
      margin-bottom: 12px;
      position: relative;
    }

    .subtitle {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      border: none;
      padding: 16px 24px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.4s, height 0.4s;
    }

    .btn:active::after {
      width: 300px;
      height: 300px;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
      color: white;
      box-shadow: 0 8px 20px rgba(238, 90, 90, 0.35);
    }

    .btn-yes:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(238, 90, 90, 0.45);
    }

    .btn-no {
      background: linear-gradient(135deg, #a8a8a8, #8e8e8e);
      color: white;
      box-shadow: 0 8px 20px rgba(142, 142, 142, 0.3);
    }

    .btn-no:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(142, 142, 142, 0.4);
    }

    .btn-think {
      background: linear-gradient(135deg, #74b9ff, #0984e3);
      color: white;
      box-shadow: 0 8px 20px rgba(9, 132, 227, 0.35);
    }

    .btn-think:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(9, 132, 227, 0.45);
    }

    .result {
      display: none;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result.show {
      display: block;
    }

    .result-icon {
      font-size: 70px;
      margin-bottom: 20px;
    }

    .result h2 {
      font-size: 24px;
      color: #e85a71;
      margin-bottom: 12px;
    }

    .result p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
    }

    .loading {
      display: none;
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }

    .loading.show {
      display: block;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 25px;
      }
      h1 {
        font-size: 24px;
      }
      .heart {
        font-size: 52px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Ana Ekran -->
    <div id="main">
      <div class="heart">💔</div>
      <h1>Özür Dilerim...</h1>
      <p class="subtitle">
        Seni üzdüğüm için gerçekten çok üzgünüm.<br>
        Lütfen beni affeder misin?
      </p>

      <div class="buttons">
        <button class="btn btn-yes" onclick="sendAnswer('evet')">Evet, affediyorum ❤️</button>
        <button class="btn btn-no" onclick="sendAnswer('hayir')">Hayır</button>
        <button class="btn btn-think" onclick="sendAnswer('dusunmem_lazim')">Düşünmem lazım...</button>
      </div>

      <div class="loading" id="loading">Gönderiliyor...</div>
    </div>

    <!-- Sonuç Ekranı -->
    <div class="result" id="result">
      <div class="result-icon" id="resultIcon">💌</div>
      <h2 id="resultTitle">Teşekkürler</h2>
      <p id="resultText">Cevabın kaydedildi.</p>
    </div>
  </div>

  <script>
    const DB_URL = "https://ozorsite-default-rtdb.firebaseio.com/cevaplar.json";

    async function sendAnswer(answer) {
      const buttons = document.querySelectorAll('.btn');
      const loading = document.getElementById('loading');
      
      buttons.forEach(btn => btn.disabled = true);
      loading.classList.add('show');

      const data = {
        cevap: answer,
        tarih: new Date().toISOString(),
        timestamp: Date.now()
      };

      try {
        await fetch(DB_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error("Hata:", err);
      }

      // Sonuç ekranını göster
      document.getElementById('main').style.display = 'none';
      const result = document.getElementById('result');
      result.classList.add('show');

      if (answer === 'evet') {
        document.getElementById('resultIcon').textContent = '❤️';
        document.getElementById('resultTitle').textContent = 'Teşekkür ederim!';
        document.getElementById('resultText').textContent = 'Beni affettiğin için çok mutluyum. Seni seviyorum 💕';
      } else if (answer === 'hayir') {
        document.getElementById('resultIcon').textContent = '😢';
        document.getElementById('resultTitle').textContent = 'Anlıyorum...';
        document.getElementById('resultText').textContent = 'Üzgünüm. Seni daha fazla üzmek istemiyorum.';
      } else {
        document.getElementById('resultIcon').textContent = '💭';
        document.getElementById('resultTitle').textContent = 'Tabii ki...';
        document.getElementById('resultText').textContent = 'Acele etme. Ne zaman istersen buradayım.';
      }
    }
  </script>
</body>
</html>
