<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nisanur ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffb6d0, #fff0f6, #ffc5dc);
  color: #a31550;
}

.card {
  width: 100%;
  max-width: 440px;
  padding: 28px 22px;
  text-align: center;
  background: rgba(255,255,255,.94);
  border-radius: 28px;
  box-shadow: 0 10px 40px #d6338440;
}

.heart {
  font-size: 65px;
  animation: kalp 1.2s infinite;
}

h1 {
  color: #d81b60;
  font-size: 32px;
}

p {
  font-size: 16px;
  line-height: 1.8;
}

button {
  display: block;
  width: 100%;
  padding: 15px;
  margin-top: 13px;
  border: none;
  border-radius: 25px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.97);
}

.evet {
  background: linear-gradient(90deg, #ff4081, #e91e63);
  color: white;
}

.hayir, .dusun {
  background: #ffe0ec;
  color: #a31550;
}

#cevap {
  display: none;
  margin-top: 22px;
  padding: 18px;
  border-radius: 18px;
  background: #fff0f6;
  font-size: 16px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

#durum {
  font-size: 13px;
  color: #a31550;
}

.ucan {
  position: fixed;
  bottom: -35px;
  pointer-events: none;
  animation: uc 7s linear forwards;
}

@keyframes kalp {
  50% { transform: scale(1.15); }
}

@keyframes uc {
  to {
    transform: translateY(-110vh) rotate(30deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<main class="card">

  <div class="heart">💗</div>

  <h1>Nisanur'um ❤️</h1>

  <p style="font-size:23px;font-weight:bold">
    Özür dilerim güzelim 🥺
  </p>

  <p>
    Seni kırdığım için gerçekten üzgünüm.
    Keşke böyle olmasaydı.
    Seni üzmek istemezdim.
    Benim için çok değerlisin ve gönlünü almak istiyorum.
  </p>

  <p>Bana bir cevap verir misin? ❤️</p>

  <button type="button" class="evet" id="evet">
    ❤️ Evet
  </button>

  <button type="button" class="hayir" id="hayir">
    💔 Hayır
  </button>

  <button type="button" class="dusun" id="dusun">
    🥺 Biraz düşünmem lazım
  </button>

  <div id="cevap" aria-live="polite"></div>
  <p id="durum"></p>

  <p style="font-size:13px;color:#bd6689">
    Senin için hazırladım Nisanur ❤️
  </p>

</main>

<script>
(function () {
  "use strict";

  const cevapAlani = document.getElementById("cevap");
  const durumAlani = document.getElementById("durum");

  const cevaplar = {
    evet: {
      secim: "Evet",
      mesaj:
        "Nisanur'um ❤️ Beni dinlediğin için teşekkür ederim. " +
        "Seni kırdığım için özür dilerim. " +
        "Seninle konuşup aramızı düzeltmek istiyorum. 💗"
    },

    hayir: {
      secim: "Hayır",
      mesaj:
        "Nisanur, kararına saygı duyuyorum. 🤍 " +
        "Seni zorlamak istemiyorum. " +
        "Seni kırdığım için gerçekten özür dilerim."
    },

    dusun: {
      secim: "Biraz düşünmem lazım",
      mesaj:
        "Tabii ki güzelim ❤️ Sana zaman vereceğim. " +
        "Hemen karar vermek zorunda değilsin. " +
        "Hazır olduğunda konuşabiliriz."
    }
  };

  function secimYap(tur) {
    const veri = cevaplar[tur];

    if (!veri) return;

    // Cevabı Firebase'den bağımsız olarak hemen göster.
    cevapAlani.textContent = veri.mesaj;
    cevapAlani.style.display = "block";

    // Sayfada hangi seçimin yapıldığını göster.
    durumAlani.textContent = "Seçimin: " + veri.secim;

    cevapAlani.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

    // Firebase kaydı ayrıca eklenebilir.
    // Firebase yapılandırması olmadan butonlar yine çalışır.
  }

  document.getElementById("evet").addEventListener("click", function () {
    secimYap("evet");
  });

  document.getElementById("hayir").addEventListener("click", function () {
    secimYap("hayir");
  });

  document.getElementById("dusun").addEventListener("click", function () {
    secimYap("dusun");
  });

  // Uçuşan kalpler
  setInterval(function () {
    const kalp = document.createElement("span");

    kalp.className = "ucan";
    kalp.textContent = ["💗", "💕", "❤️", "♡"][
      Math.floor(Math.random() * 4)
    ];

    kalp.style.left = Math.random() * 100 + "vw";
    kalp.style.fontSize = (18 + Math.random() * 20) + "px";

    document.body.appendChild(kalp);

    setTimeout(function () {
      kalp.remove();
    }, 7000);
  }, 800);

})();
</script>

</body>
</html>
