<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nisanur ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      color: #fff;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      animation: float 7s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
      position: relative;
      z-index: 2;
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      border: none;
      padding: 15px;
      border-radius: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.04);
    }

    #yes {
      background: #ff4f81;
      color: white;
    }

    #think {
      background: white;
      color: #ff4f81;
    }

    #no {
      background: rgba(255, 255, 255, 0.35);
      color: white;
    }

    #result {
      display: none;
      margin-top: 20px;
    }

    #result h2 {
      font-size: 27px;
      margin-bottom: 15px;
    }

    .result-text {
      font-size: 18px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="hearts">
    <div class="heart" style="left:10%; animation-delay:0s;">❤️</div>
    <div class="heart" style="left:25%; animation-delay:2s;">💗</div>
    <div class="heart" style="left:45%; animation-delay:4s;">💕</div>
    <div class="heart" style="left:65%; animation-delay:1s;">❤️</div>
    <div class="heart" style="left:85%; animation-delay:3s;">💖</div>
  </div>

  <div class="card">

    <div id="question">

      <h1>Nisanur ❤️</h1>

      <p>
        Sana bir süredir söylemek istediğim bir şey var...
      </p>

      <p>
        Seninle konuştuğumda kendimi daha mutlu hissediyorum.
        Zaman geçtikçe seni daha farklı ve daha özel görmeye başladım.
      </p>

      <p>
        Bunu artık içimde tutmak istemedim.
      </p>

      <h2>Benimle çıkar mısın?</h2>

      <div class="buttons">
        <button id="yes" onclick="answer('Evet')">
          Evet ❤️
        </button>

        <button id="think" onclick="answer('Biraz düşünmem lazım')">
          Biraz düşünmem lazım
        </button>

        <button id="no" onclick="answer('Hayır')">
          Hayır
        </button>
      </div>

    </div>

    <div id="result"></div>

  </div>

  <script>
    let answered = false;

    function answer(choice) {

      if (answered) return;

      answered = true;

      const question = document.getElementById("question");
      const result = document.getElementById("result");

      question.style.display = "none";
      result.style.display = "block";

      if (choice === "Evet") {

        result.innerHTML = `
          <h2>Evet dediğini görmek gerçekten çok güzel ❤️</h2>

          <div class="result-text">
            <p>
              Bunu sana söylemek için uzun zamandır cesaret toplamaya çalışıyordum.<br>
              Şimdi yüzümde istemsiz bir gülümseme var :)
            </p>

            <p>
              Bundan sonrası için güzel anılar biriktirelim.
            </p>
          </div>
        `;

        confetti({
          particleCount: 180,
          spread: 100,
          origin: { y: 0.6 }
        });

      }

      else if (choice === "Biraz düşünmem lazım") {

        result.innerHTML = `
          <h2>Acele etme ❤️</h2>

          <div class="result-text">
            <p>
              Tabii ki, istediğin kadar düşün.
            </p>

            <p>
              Ne hissediyorsan onu dürüstçe söylemen benim için yeterli.
            </p>
          </div>
        `;

      }

      else {

        result.innerHTML = `
          <h2>Canın sağ olsun ❤️</h2>

          <div class="result-text">
            <p>
              Yine de bunu sana söylemiş olmaktan pişman değilim.
            </p>

            <p>
              Dürüst olduğun için teşekkür ederim.
            </p>
          </div>
        `;
      }

      // Formspree'ye cevabı arka planda gönder
      fetch("https://formspree.io/f/xvkgello", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          cevap: choice,
          tarih: new Date().toLocaleString("tr-TR")
        })
      }).catch(error => {
        console.log("Form gönderme hatası:", error);
      });
    }
  </script>

</body>
</html>
