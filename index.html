
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Aradığın Kişi Bulunamadı</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}
.container {
  padding: 25px;
  max-width: 450px;
}
h1 {
  font-size: 32px;
  color: #ff3030;
}
p {
  color: #aaa;
  font-size: 17px;
}
button {
  border: none;
  background: #ff3030;
  color: white;
  padding: 15px 25px;
  border-radius: 12px;
  font-size: 17px;
  cursor: pointer;
  margin-top: 15px;
}
#result {
  margin-top: 25px;
  font-size: 23px;
  font-weight: bold;
  color: #ff5555;
  min-height: 60px;
}
small {
  color: #555;
}
</style>
</head>
<body>

<div class="container">
  <h1>Tekrar buraya mı geldin?</h1>
  <p>Son ziyaretinden beri hiçbir şey değişmedi.</p>
  <h2>SİKTİR GİT AMK 💀</h2>

  <button onclick="random()">Bir daha dene</button>

  <div id="result"></div>

  <small>404 — İstenmeyen ziyaretçi</small>
</div>

<script>
const messages = [
  "PUHAHAHAHAHA",
  "HÂLÂ GİTMEDİN Mİ? 😭",
  "KAPAT ŞUNU AMK",
  "PUAHAHAHAHAHA",
  "SENİN BURADA NE İŞİN VAR",
  "404 BEYİN BULUNAMADI 💀",
  "YİNE Mİ SEN LAN",
  "PUHAHAHAHAHAHA"
];

function random() {
  const result = document.getElementById("result");
  result.textContent = messages[Math.floor(Math.random() * messages.length)];
}
</script>

</body>
</html>
